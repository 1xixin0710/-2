databases:
  - name: dagong-library-db
    databaseName: dagong_library
    user: dagong_library
    plan: free
    region: singapore

services:
  - type: web
    name: dagong-cloud-library
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /catalog
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: dagong-library-db
          property: connectionString
