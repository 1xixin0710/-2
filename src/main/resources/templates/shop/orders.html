<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('我的订单')}"></head>
<body class="site-page">
<header th:replace="~{fragments :: siteHeader('orders')}"></header>
<main class="container site-main">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="page-heading">
        <div>
            <p class="eyebrow">MY ORDERS</p>
            <h1>我的订单</h1>
            <p>查看订单进度、配送信息和商品明细。</p>
        </div>
        <a class="button button-outline" th:href="@{/catalog}"><i data-lucide="book-open"></i> 继续选购</a>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
        <i data-lucide="receipt-text"></i>
        <h2>还没有订单</h2>
        <p>选购图书并完成结算后，订单会显示在这里。</p>
        <a class="button button-primary" th:href="@{/catalog}">去选购</a>
    </div>

    <section class="order-list" th:unless="${#lists.isEmpty(orders)}">
        <article class="order-card" th:each="order : ${orders}">
            <header>
                <div>
                    <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-31 14:30</span>
                    <strong th:text="${'订单号 ' + order.orderNo}">订单号</strong>
                </div>
                <span class="order-status" th:classappend="${order.statusClass}" th:text="${order.status}">待发货</span>
            </header>
            <div class="order-body">
                <div class="order-products">
                    <a th:each="item, iter : ${order.items}" th:if="${iter.index < 4}"
                       th:href="@{/orders/{id}(id=${order.id})}">
                        <img th:src="${item.coverUrl}" th:alt="${item.productName}">
                    </a>
                    <div>
                        <h2 th:text="${order.items[0].productName + (order.items.size() > 1 ? ' 等 ' + order.items.size() + ' 种商品' : '')}">
                            百年孤独
                        </h2>
                        <p th:text="${'收货人 ' + order.recipient + ' · ' + order.deliveryType}">收货信息</p>
                    </div>
                </div>
                <div class="order-money">
                    <span th:text="${'共 ' + order.itemCount + ' 件'}">共 2 件</span>
                    <strong th:text="${'¥' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">¥79.60</strong>
                </div>
                <div class="order-actions">
                    <a class="button button-small button-outline" th:href="@{/orders/{id}(id=${order.id})}">查看详情</a>
                    <form th:if="${order.status == '待发货'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post"
                          data-confirm="确认取消该订单？取消后商品库存会恢复。">
                        <button class="button button-small" type="submit">取消订单</button>
                    </form>
                    <form th:if="${order.status == '待收货'}" th:action="@{/orders/{id}/receive(id=${order.id})}" method="post">
                        <button class="button button-small button-primary" type="submit">确认收货</button>
                    </form>
                </div>
            </div>
        </article>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
