<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('注册')}"></head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-visual">
        <a class="brand brand-light" th:href="@{/catalog}">
            <span class="brand-seal">大图</span>
            <span class="brand-name">
                <strong>大工云图书馆</strong>
                <small>DALIAN UNIVERSITY OF TECHNOLOGY LIBRARY</small>
            </span>
        </a>
        <div class="auth-visual-copy">
            <p>新读者登记</p>
            <h1>一张借书证<br>连接全部馆藏</h1>
            <span>注册后即可预约图书、查看借阅期限并办理归还。</span>
        </div>
        <p class="auth-photo-note">馆藏目录 · 阅览服务</p>
    </section>

    <section class="auth-form-panel auth-register-panel">
        <div class="auth-form-wrap auth-register-wrap">
            <a class="back-link" th:href="@{/catalog}"><i data-lucide="arrow-left"></i> 返回馆藏检索</a>
            <h2>注册读者账号</h2>
            <p class="auth-intro">首名注册账号用于初始化馆员权限，之后注册的账号均为读者。</p>

            <form class="auth-form register-form" th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-alert form-alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">注册失败</p>
                </div>
                <div class="two-column">
                    <label class="field">
                        <span>用户名 <em>*</em></span>
                        <input type="text" th:field="*{username}" autocomplete="username" placeholder="4—20位字母或数字">
                        <small class="field-error" th:if="${#fields.hasErrors('username')}"
                               th:errors="*{username}">用户名错误</small>
                    </label>
                    <label class="field">
                        <span>姓名 <em>*</em></span>
                        <input type="text" th:field="*{displayName}" autocomplete="name" placeholder="用于借阅记录">
                        <small class="field-error" th:if="${#fields.hasErrors('displayName')}"
                               th:errors="*{displayName}">姓名错误</small>
                    </label>
                </div>
                <div class="two-column">
                    <label class="field">
                        <span>学号 / 工号 <em>*</em></span>
                        <input type="text" th:field="*{studentNo}" placeholder="例如 2026310101">
                        <small class="field-error" th:if="${#fields.hasErrors('studentNo')}"
                               th:errors="*{studentNo}">学号错误</small>
                    </label>
                    <label class="field">
                        <span>院系 <em>*</em></span>
                        <input type="text" th:field="*{department}" placeholder="例如 软件学院">
                        <small class="field-error" th:if="${#fields.hasErrors('department')}"
                               th:errors="*{department}">院系错误</small>
                    </label>
                </div>
                <label class="field">
                    <span>密码 <em>*</em></span>
                    <span class="password-shell">
                        <input type="password" th:field="*{password}" autocomplete="new-password"
                               placeholder="至少8位" data-password-input>
                        <button type="button" class="password-toggle" data-password-toggle aria-label="显示密码">
                            <i data-lucide="eye"></i>
                        </button>
                    </span>
                    <small class="field-error" th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}">密码错误</small>
                </label>
                <button class="button button-primary button-block" type="submit">
                    创建账号 <i data-lucide="arrow-right"></i>
                </button>
            </form>
            <p class="auth-switch">已有账号？<a th:href="@{/login}">返回登录</a></p>
        </div>
    </section>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
