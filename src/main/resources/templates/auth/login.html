<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('登录')}"></head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-visual">
        <a class="brand brand-light" th:href="@{/catalog}">
            <span class="brand-mark"><i data-lucide="book-open"></i></span>
            <span class="brand-copy">
                <strong>云序书集</strong>
                <small>校园精选书店</small>
            </span>
        </a>
        <div class="auth-visual-copy">
            <p>课程教材 · 经典阅读 · 前沿技术</p>
            <h1>需要的书<br>一次买齐</h1>
            <span>校园配送与到店自提均可选择，订单和库存记录保存在云端数据库中。</span>
        </div>
        <p class="auth-photo-note">校园阅读空间 · 云序书集</p>
    </section>

    <section class="auth-form-panel">
        <div class="auth-form-wrap">
            <a class="back-link" th:href="@{/catalog}"><i data-lucide="arrow-left"></i> 返回商城首页</a>
            <h2>账号登录</h2>
            <p class="auth-intro">登录后可结算购物车、查看订单和确认收货。</p>

            <div class="form-alert" th:if="${success}" th:text="${success}">注册成功</div>
            <div class="form-alert form-alert-error" th:if="${error}" th:text="${error}">用户名或密码错误</div>

            <form class="auth-form" th:action="@{/login}" method="post">
                <label class="field">
                    <span>用户名</span>
                    <input type="text" name="username" autocomplete="username" required autofocus
                           placeholder="请输入用户名">
                </label>
                <label class="field">
                    <span>密码</span>
                    <span class="password-shell">
                        <input type="password" name="password" autocomplete="current-password" required
                               placeholder="请输入密码" data-password-input>
                        <button type="button" class="password-toggle" data-password-toggle aria-label="显示密码">
                            <i data-lucide="eye"></i>
                        </button>
                    </span>
                </label>
                <button class="button button-primary button-block" type="submit">
                    登录 <i data-lucide="arrow-right"></i>
                </button>
            </form>
            <p class="auth-switch">还没有账号？<a th:href="@{/register}">注册新账号</a></p>
            <p class="auth-footnote">浏览和加入购物车无需登录；提交订单、查看订单与进入管理后台需要登录。</p>
        </div>
    </section>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
