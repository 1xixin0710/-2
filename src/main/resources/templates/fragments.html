<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · 大工云图书馆'">大工云图书馆</title>
    <meta name="description" content="大工云图书馆馆藏检索与借阅服务">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/lucide.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<header class="site-header" th:fragment="header(active)">
    <div class="header-inner">
        <a class="brand" th:href="@{/catalog}" aria-label="大工云图书馆首页">
            <span class="brand-seal">大图</span>
            <span class="brand-name">
                <strong>大工云图书馆</strong>
                <small>DALIAN UNIVERSITY OF TECHNOLOGY LIBRARY</small>
            </span>
        </a>

        <nav class="primary-nav" aria-label="主要导航">
            <a th:href="@{/catalog}" th:classappend="${active == 'catalog'} ? 'is-active'">
                <i data-lucide="library-big"></i>
                <span>馆藏检索</span>
            </a>
            <a th:if="${session.authUser != null}" th:href="@{/loans}"
               th:classappend="${active == 'loans'} ? 'is-active'">
                <i data-lucide="book-marked"></i>
                <span th:text="${session.authUser.librarian ? '借阅管理' : '我的借阅'}">我的借阅</span>
            </a>
            <a th:if="${session.authUser != null and session.authUser.librarian}"
               th:href="@{/librarian/books/new}" th:classappend="${active == 'manage'} ? 'is-active'">
                <i data-lucide="book-plus"></i>
                <span>图书入藏</span>
            </a>
        </nav>

        <div class="account-area">
            <div class="reader-meta" th:if="${session.authUser != null}">
                <span class="reader-avatar" th:text="${#strings.substring(session.authUser.displayName, 0, 1)}">林</span>
                <span>
                    <strong th:text="${session.authUser.displayName}">张同学</strong>
                    <small th:text="${session.authUser.roleLabel + ' · ' + session.authUser.studentNo}">读者 · 20260001</small>
                </span>
            </div>
            <form th:if="${session.authUser != null}" th:action="@{/logout}" method="post">
                <button class="icon-button" type="submit" title="退出登录" aria-label="退出登录">
                    <i data-lucide="log-out"></i>
                </button>
            </form>
            <div class="guest-actions" th:if="${session.authUser == null}">
                <a class="text-button" th:href="@{/login}">登录</a>
                <a class="button button-primary button-small" th:href="@{/register}">注册</a>
            </div>
        </div>
    </div>
</header>

<div th:fragment="flash" class="flash-stack" aria-live="polite">
    <div class="flash flash-success" th:if="${success}">
        <i data-lucide="circle-check"></i>
        <span th:text="${success}">操作成功</span>
    </div>
    <div class="flash flash-error" th:if="${error}">
        <i data-lucide="circle-alert"></i>
        <span th:text="${error}">操作失败</span>
    </div>
</div>

<footer class="site-footer" th:fragment="footer">
    <div>
        <strong>大工云图书馆</strong>
        <span>馆藏检索与借阅服务</span>
    </div>
    <p>借阅服务时间：周一至周日 08:00—22:00</p>
</footer>

<div th:fragment="scripts">
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</div>
</body>
</html>
