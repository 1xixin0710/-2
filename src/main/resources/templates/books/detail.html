<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${book.title})}"></head>
<body class="site-page">
<header th:replace="~{fragments :: header('catalog')}"></header>
<main class="site-main">
    <div th:replace="~{fragments :: flash}"></div>
    <a class="back-link" th:href="@{/catalog}"><i data-lucide="arrow-left"></i> 返回馆藏检索</a>

    <article class="book-detail">
        <div class="detail-cover-column">
            <img class="detail-cover" th:src="${book.coverUrl}" th:alt="${book.title}">
            <p class="cover-note"><i data-lucide="scan-barcode"></i> ISBN <span th:text="${book.isbn}">9780132350884</span></p>
        </div>

        <div class="detail-content">
            <div class="detail-title-row">
                <div>
                    <p class="section-kicker" th:text="${book.category + ' / ' + book.language}">计算机 / 英文</p>
                    <h1 th:text="${book.title}">Clean Code</h1>
                    <p class="detail-author" th:text="${book.author}">Robert C. Martin</p>
                </div>
                <span class="availability availability-large"
                      th:classappend="${book.available ? 'is-available' : 'is-unavailable'}"
                      th:text="${book.availabilityLabel}">可借</span>
            </div>

            <p class="detail-summary" th:text="${book.summary}">图书简介</p>

            <div class="detail-tags" th:with="tagList=${#strings.arraySplit(book.tags, ',')}">
                <span th:each="tag : ${tagList}" th:text="${tag}">课程参考</span>
            </div>

            <dl class="holding-table">
                <div><dt>出版社</dt><dd th:text="${book.publisher}">Prentice Hall</dd></div>
                <div><dt>出版年份</dt><dd th:text="${book.publishYear}">2008</dd></div>
                <div><dt>索书号</dt><dd th:text="${book.callNumber}">TP311.5/M381</dd></div>
                <div><dt>馆藏地</dt><dd th:text="${book.location}">伯川图书馆三层</dd></div>
                <div><dt>可借 / 馆藏</dt><dd th:text="${book.availableCopies + ' / ' + book.totalCopies + ' 册'}">3 / 6 册</dd></div>
                <div><dt>入藏日期</dt><dd th:text="${#temporals.format(book.acquisitionDate, 'yyyy-MM-dd')}">2026-09-18</dd></div>
            </dl>

            <div class="detail-actions">
                <a class="button button-primary" th:if="${book.available and session.authUser != null}"
                   th:href="@{/loans/borrow/{id}(id=${book.id})}">
                    <i data-lucide="book-open-check"></i> 预约借阅
                </a>
                <a class="button button-primary" th:if="${book.available and session.authUser == null}"
                   th:href="@{/login}">
                    <i data-lucide="log-in"></i> 登录后借阅
                </a>
                <span class="unavailable-copy" th:if="${!book.available}">当前馆藏已全部借出，请稍后再次查询。</span>

                <div class="librarian-actions" th:if="${session.authUser != null and session.authUser.librarian}">
                    <a class="button button-outline" th:href="@{/librarian/books/{id}/edit(id=${book.id})}">
                        <i data-lucide="pencil-line"></i> 编辑馆藏
                    </a>
                    <button class="button button-danger-outline" type="button"
                            data-delete-book th:attr="data-id=${book.id},data-title=${book.title}">
                        <i data-lucide="trash-2"></i> 删除
                    </button>
                </div>
            </div>
        </div>
    </article>
</main>

<dialog class="confirm-dialog" id="deleteBookDialog">
    <form method="post" id="deleteBookForm">
        <span class="dialog-icon"><i data-lucide="trash-2"></i></span>
        <h2>删除馆藏记录？</h2>
        <p>“<strong id="deleteBookTitle"></strong>”删除后无法恢复。仍有未归还记录时系统会拒绝删除。</p>
        <div class="dialog-actions">
            <button class="button button-outline" type="button" data-dialog-close>取消</button>
            <button class="button button-danger" type="submit">确认删除</button>
        </div>
    </form>
</dialog>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
