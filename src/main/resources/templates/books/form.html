<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${mode == 'create' ? '图书入藏' : '编辑馆藏'})}"></head>
<body class="site-page">
<header th:replace="~{fragments :: header('manage')}"></header>
<main class="site-main">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="page-heading compact">
        <div>
            <a class="back-link" th:href="${mode == 'edit'} ? @{/books/{id}(id=${book.id})} : @{/catalog}">
                <i data-lucide="arrow-left"></i> 返回
            </a>
            <h1 th:text="${mode == 'create' ? '新书入藏' : '编辑馆藏信息'}">新书入藏</h1>
            <p>馆员维护书目、索书号、馆藏位置和复本数量。</p>
        </div>
    </div>

    <form class="book-form" th:action="${mode == 'create'} ? @{/librarian/books} : @{/librarian/books/{id}(id=${book.id})}"
          th:object="${book}" method="post">
        <div class="form-main">
            <section class="form-section">
                <div class="form-section-title">
                    <span>01</span>
                    <div><h2>书目信息</h2><p>用于检索和识别馆藏。</p></div>
                </div>
                <div class="form-alert form-alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">保存失败</p>
                </div>
                <div class="form-grid">
                    <label class="field span-2">
                        <span>书名 <em>*</em></span>
                        <input type="text" th:field="*{title}" placeholder="请输入书名">
                        <small class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">书名错误</small>
                    </label>
                    <label class="field">
                        <span>作者 <em>*</em></span>
                        <input type="text" th:field="*{author}" placeholder="作者或编者">
                        <small class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">作者错误</small>
                    </label>
                    <label class="field">
                        <span>ISBN <em>*</em></span>
                        <input type="text" th:field="*{isbn}" placeholder="13位ISBN">
                        <small class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}">ISBN错误</small>
                    </label>
                    <label class="field">
                        <span>出版社 <em>*</em></span>
                        <input type="text" th:field="*{publisher}" placeholder="出版社名称">
                        <small class="field-error" th:if="${#fields.hasErrors('publisher')}" th:errors="*{publisher}">出版社错误</small>
                    </label>
                    <label class="field">
                        <span>出版年份 <em>*</em></span>
                        <input type="number" min="1900" max="2026" th:field="*{publishYear}">
                        <small class="field-error" th:if="${#fields.hasErrors('publishYear')}" th:errors="*{publishYear}">年份错误</small>
                    </label>
                    <label class="field">
                        <span>馆藏分类 <em>*</em></span>
                        <select th:field="*{category}">
                            <option th:each="category : ${categories}" th:value="${category}" th:text="${category}">计算机</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>封面路径</span>
                        <input type="text" th:field="*{coverUrl}" placeholder="/images/covers/..."
                               data-cover-url>
                        <small class="field-hint">留空时使用默认图书图片</small>
                    </label>
                    <fieldset class="field radio-field">
                        <legend>语种 <em>*</em></legend>
                        <div class="radio-row">
                            <label th:each="language : ${languages}">
                                <input type="radio" th:field="*{language}" th:value="${language}">
                                <span th:text="${language}">中文</span>
                            </label>
                        </div>
                    </fieldset>
                    <fieldset class="field checkbox-field">
                        <legend>书目标签 <em>*</em></legend>
                        <div class="check-row">
                            <label th:each="tag : ${tagOptions}">
                                <input type="checkbox" th:field="*{tagChoices}" th:value="${tag}">
                                <span th:text="${tag}">课程参考</span>
                            </label>
                        </div>
                        <small class="field-error" th:if="${#fields.hasErrors('tagChoices')}"
                               th:errors="*{tagChoices}">标签错误</small>
                    </fieldset>
                    <label class="field span-2">
                        <span>内容简介 <em>*</em></span>
                        <textarea th:field="*{summary}" rows="5" placeholder="简要说明内容、适用课程或版本信息"></textarea>
                        <small class="field-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}">简介错误</small>
                    </label>
                </div>
            </section>

            <section class="form-section">
                <div class="form-section-title">
                    <span>02</span>
                    <div><h2>馆藏信息</h2><p>确定排架位置与实际可借数量。</p></div>
                </div>
                <div class="form-grid">
                    <label class="field">
                        <span>索书号 <em>*</em></span>
                        <input type="text" th:field="*{callNumber}" placeholder="例如 TP311.5/M381">
                        <small class="field-error" th:if="${#fields.hasErrors('callNumber')}" th:errors="*{callNumber}">索书号错误</small>
                    </label>
                    <label class="field">
                        <span>馆藏地 <em>*</em></span>
                        <select th:field="*{location}">
                            <option th:each="location : ${locations}" th:value="${location}" th:text="${location}">伯川图书馆三层</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>馆藏册数 <em>*</em></span>
                        <input type="number" min="1" max="999" th:field="*{totalCopies}">
                        <small class="field-error" th:if="${#fields.hasErrors('totalCopies')}" th:errors="*{totalCopies}">册数错误</small>
                    </label>
                    <label class="field">
                        <span>馆藏状态 <em>*</em></span>
                        <select th:field="*{status}">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}">在馆</option>
                        </select>
                    </label>
                    <label class="field span-2">
                        <span>入藏时间 <em>*</em></span>
                        <input type="datetime-local" th:field="*{acquisitionDate}">
                        <small class="field-error" th:if="${#fields.hasErrors('acquisitionDate')}" th:errors="*{acquisitionDate}">日期错误</small>
                    </label>
                </div>
            </section>
        </div>

        <aside class="form-aside">
            <div class="cover-preview">
                <span>封面预览</span>
                <img th:src="${book.coverUrl == null or book.coverUrl.isBlank() ? '/images/covers/default-book.jpg' : book.coverUrl}"
                     th:alt="${book.title == null ? '图书封面' : book.title}" data-cover-preview>
            </div>
            <div class="form-note">
                <i data-lucide="info"></i>
                <p>修改馆藏册数时，系统会保留当前借出数量，不会覆盖在借记录。</p>
            </div>
            <div class="form-actions">
                <button class="button button-primary button-block" type="submit">
                    <i data-lucide="save"></i>
                    <span th:text="${mode == 'create' ? '保存并入藏' : '保存修改'}">保存</span>
                </button>
                <a class="button button-outline button-block"
                   th:href="${mode == 'edit'} ? @{/books/{id}(id=${book.id})} : @{/catalog}">取消</a>
            </div>
        </aside>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
