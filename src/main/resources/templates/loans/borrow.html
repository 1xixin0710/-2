<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('预约借阅')}"></head>
<body class="site-page">
<header th:replace="~{fragments :: header('loans')}"></header>
<main class="site-main">
    <div class="page-heading compact">
        <div>
            <a class="back-link" th:href="@{/books/{id}(id=${book.id})}"><i data-lucide="arrow-left"></i> 返回图书详情</a>
            <h1>预约借阅</h1>
            <p>选择取书时间与借期，提交后请按时到馆办理取书。</p>
        </div>
    </div>

    <div class="borrow-layout">
        <form class="borrow-form" th:action="@{/loans/borrow/{id}(id=${book.id})}" th:object="${loan}" method="post">
            <div class="form-alert form-alert-error" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">借阅失败</p>
            </div>
            <fieldset class="field radio-field">
                <legend>借阅类型 <em>*</em></legend>
                <div class="radio-row">
                    <label th:each="type : ${borrowTypes}">
                        <input type="radio" th:field="*{borrowType}" th:value="${type}">
                        <span th:text="${type}">个人借阅</span>
                    </label>
                </div>
            </fieldset>
            <label class="field">
                <span>取书地点 <em>*</em></span>
                <select th:field="*{pickupLocation}">
                    <option th:each="location : ${pickupLocations}" th:value="${location}" th:text="${location}">伯川图书馆三层</option>
                </select>
            </label>
            <div class="two-column">
                <label class="field">
                    <span>预约取书时间 <em>*</em></span>
                    <input type="datetime-local" th:field="*{scheduledPickupAt}">
                    <small class="field-error" th:if="${#fields.hasErrors('scheduledPickupAt')}"
                           th:errors="*{scheduledPickupAt}">时间错误</small>
                </label>
                <label class="field">
                    <span>应还日期 <em>*</em></span>
                    <input type="date" th:field="*{dueDate}">
                    <small class="field-error" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}">日期错误</small>
                </label>
            </div>
            <label class="field">
                <span>联系电话 <em>*</em></span>
                <input type="text" th:field="*{contact}" placeholder="用于取书联系">
                <small class="field-error" th:if="${#fields.hasErrors('contact')}" th:errors="*{contact}">电话错误</small>
            </label>
            <label class="field">
                <span>备注</span>
                <textarea th:field="*{note}" rows="3" placeholder="课程、研究方向或其他说明（选填）"></textarea>
            </label>
            <div class="borrow-submit">
                <button class="button button-primary" type="submit"><i data-lucide="send"></i> 提交借阅申请</button>
                <a class="button button-outline" th:href="@{/books/{id}(id=${book.id})}">取消</a>
            </div>
        </form>

        <aside class="borrow-book-summary">
            <img th:src="${book.coverUrl}" th:alt="${book.title}">
            <p class="section-kicker" th:text="${book.category}">计算机</p>
            <h2 th:text="${book.title}">Clean Code</h2>
            <p th:text="${book.author}">Robert C. Martin</p>
            <dl>
                <div><dt>索书号</dt><dd th:text="${book.callNumber}">TP311.5/M381</dd></div>
                <div><dt>馆藏地</dt><dd th:text="${book.location}">伯川图书馆三层</dd></div>
                <div><dt>可借册数</dt><dd th:text="${book.availableCopies + ' 册'}">3 册</dd></div>
            </dl>
        </aside>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
