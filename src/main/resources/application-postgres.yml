spring:
  config:
    activate:
      on-profile: postgres
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8
    use-relative-redirects: true

logging:
  level:
    com.dlut.library.mapper: info
