server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
    session:
      tracking-modes: cookie
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: yunxu-books
  datasource:
    url: jdbc:h2:mem:yunxu_books;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dlut.library.model
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.dlut.library.mapper: info
